# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: arab-risk-monitor
    runtime: python
    plan: free
    branch: feat/public-demo-browser-history
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      # One process, offline retrieval: lower memory and no unmetered embeddings.
      - key: ARM_MCP
        value: "0"
      - key: ARM_RETRIEVER
        value: tfidf
      - key: ARM_CHAT_RATE_LIMIT
        value: "10"
      - key: ARM_CHAT_WINDOW_SECONDS
        value: "3600"
      - key: ARM_CHAT_MAX_CONCURRENT
        value: "2"
      - key: ARM_CHAT_TIMEOUT_SECONDS
        value: "120"
      - key: ARM_CHAT_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: ARM_CHAT_MAX_MODEL_CALLS
        value: "12"
      - key: ARM_CHAT_MAX_TOOL_CALLS
        value: "24"
